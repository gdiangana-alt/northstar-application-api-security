name: ZAP Juice Shop Baseline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap-baseline:
    name: Lab baseline scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare isolated lab and scanner
        run: |
          mkdir -p evidence
          docker pull bkimminich/juice-shop:v19.1.1
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker pull nginx:stable-alpine
          for image in bkimminich/juice-shop:v19.1.1 ghcr.io/zaproxy/zaproxy:stable nginx:stable-alpine; do
            docker image inspect "$image" --format '{{json .RepoDigests}}' >> evidence/image-digests.txt
          done
          docker run --rm -d --name northstar-juice-shop -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v19.1.1
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          docker run --rm --network host -v "$GITHUB_WORKSPACE/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
          docker run --rm -d --name northstar-gateway --network host -v "$GITHUB_WORKSPACE/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/ >/dev/null

      - name: Validate selected response and API controls
        run: python3 scripts/validate_controls.py

      - name: Install browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/northstar-browser-venv"
          "$RUNNER_TEMP/northstar-browser-venv/bin/pip" install playwright==1.56.0
          "$RUNNER_TEMP/northstar-browser-venv/bin/python" -m playwright install --with-deps chromium

      - name: Validate catalogue and CSP in Chromium
        run: '"$RUNNER_TEMP/northstar-browser-venv/bin/python" scripts/browser_smoke.py'

      - name: Scan baseline and gateway
        run: |
          zap_uid="$(docker run --rm --entrypoint id ghcr.io/zaproxy/zaproxy:stable -u)"
          zap_gid="$(docker run --rm --entrypoint id ghcr.io/zaproxy/zaproxy:stable -g)"
          sudo chown -R "$zap_uid:$zap_gid" evidence
          for scope in baseline hardened; do
            port=3000
            if [ "$scope" = hardened ]; then port=3001; fi
            docker run --rm --network host -v "$GITHUB_WORKSPACE/evidence:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "http://127.0.0.1:$port" -J "$scope.json" -r "$scope.html" -I
            test -s "evidence/$scope.html"
            test -s "evidence/$scope.json"
            python3 -m json.tool "evidence/$scope.json" >/dev/null
          done
          sudo chown -R "$(id -u):$(id -g)" evidence

      - name: Gate selected controls on retest evidence
        run: python3 scripts/check_scan.py

      - name: Upload baseline and retest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-and-retest
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated lab
        if: always()
        run: |
          docker rm -f northstar-gateway northstar-juice-shop || true

